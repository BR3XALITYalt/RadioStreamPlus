name: Continuous pre-release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: continuous-prerelease
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Check Python files
        run: |
          python -m compileall -q radiostream_bootstrap.py radiostream.py radiostream_core.py radiostream_server.py
          python -m unittest discover -s tests -v

      - name: Build executable
        run: |
          python -m pip install --disable-pip-version-check pyinstaller
          python -m PyInstaller --noconfirm --clean --onefile --console --name RadioStreamPlus --collect-all xml --hidden-import xml --hidden-import xml.etree --hidden-import xml.etree.ElementPath --hidden-import xml.etree.ElementTree --hidden-import xml.parsers --hidden-import xml.parsers.expat --hidden-import pyexpat radiostream_bootstrap.py

      - name: Upload Windows executable
        uses: actions/upload-artifact@v7
        with:
          name: RadioStreamPlus-Windows
          path: dist/RadioStreamPlus.exe
          archive: true
          if-no-files-found: error
          retention-days: 90

      - name: Publish Nightly download link
        shell: pwsh
        run: |
          @"
          ## Nightly Windows build

          [Download the latest RadioStream+ Windows build](https://nightly.link/BR3XALITYalt/RadioStreamPlus/workflows/continuous-prerelease/main/RadioStreamPlus-Windows.zip)

          The download is a ZIP containing `RadioStreamPlus.exe`.
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

  update-prerelease:
    needs: build-windows
    runs-on: ubuntu-latest

    steps:
      - name: Check out latest commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download Windows executable
        uses: actions/download-artifact@v8
        with:
          name: RadioStreamPlus-Windows
          path: release-assets

      - name: Package source
        run: |
          git archive --format=zip --prefix=RadioStreamPlus/ "$GITHUB_SHA" > RadioStreamPlus-prerelease.zip

      - name: Move continuous tag to this commit
        run: |
          git tag -f continuous "$GITHUB_SHA"
          git push origin refs/tags/continuous --force

      - name: Create or update pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          cat > release-notes.md <<'EOF'
          ## Continuous pre-release

          This pre-release is updated automatically whenever a commit is pushed to `main`.

          You probably do not need to install this pre-release if RadioStream+ is already updating normally. Use it for a manual or offline installation, or when the automatic updater is unavailable or has failed.

          The release includes the current source archive and an experimental Windows x64 executable. The executable downloads the current source when online and can use its cached source when GitHub is unavailable.

          The latest Windows executable is also available through [nightly.link](https://nightly.link/BR3XALITYalt/RadioStreamPlus/workflows/continuous-prerelease/main/RadioStreamPlus-Windows.zip).

          If something goes wrong, report it in [GitHub Issues](https://github.com/BR3XALITYalt/RadioStreamPlus/issues).

          EOF

          printf '\nBuild commit: %s\n' "$COMMIT_SHA" >> release-notes.md

          if gh release view continuous --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release edit continuous \
              --repo "$REPOSITORY" \
              --title "Continuous pre-release" \
              --notes-file release-notes.md \
              --prerelease \
              --latest=false
          else
            gh release create continuous \
              --repo "$REPOSITORY" \
              --title "Continuous pre-release" \
              --notes-file release-notes.md \
              --prerelease \
              --latest=false \
              --verify-tag
          fi

          gh release upload continuous \
            RadioStreamPlus-prerelease.zip \
            release-assets/RadioStreamPlus.exe \
            --repo "$REPOSITORY" \
            --clobber
